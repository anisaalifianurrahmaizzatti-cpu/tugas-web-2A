<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir Anisa</title>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .kotak-utama {
            background: #ffffff;
            width: 440px;
            max-width: 90%;
            padding: 30px;
            border-radius: 20px;
            border: 1px solid #dddddd;
        }

        #hasilStruk {
            display: none;
            background-color: #ffffff;
            color: #222222;
            padding: 15px;
            border-radius: 12px;
            text-align: left;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            border: 1px solid #dddddd;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<div class="kotak-utama">
    <div id="hasilStruk"></div>
</div>

<script>

    function formatRp(angka) {
        return angka.toLocaleString('id-ID');
    }

    function jalankanKasir() {

        // Input nama barang
        let namaBarang = prompt("Masukkan nama barang:");

        if (!namaBarang) {
            return;
        }

        // Input harga barang
        let hargaBarang = parseFloat(
            prompt("Masukkan harga barang:")
        ) || 0;

        // Input jumlah barang
        let qty = parseInt(
            prompt("Masukkan jumlah barang:")
        ) || 0;

        // Validasi
        if (hargaBarang <= 0 || qty <= 0) {
            alert("Harga atau jumlah barang tidak boleh kosong atau nol!");
            return;
        }

        // Menghitung total
        let total = hargaBarang * qty;

        // Menghitung diskon
        let diskon = 0;

        if (total > 50000) {
            diskon = total * 0.10;
        }

        // Total bayar
        let totalBayar = total - diskon;

        // Membuat struk rata kiri
        let struk =
            "====================================\n" +
            "STRUK BELANJA\n" +
            "====================================\n" +
            "\n" +
            "Nama Barang : " + namaBarang + "\n" +
            "Harga       : Rp " + formatRp(hargaBarang) + "\n" +
            "Jumlah      : " + qty + "\n" +
            "Total       : Rp " + formatRp(total) + "\n" +
            "\n" +
            "Diskon 10%  : Rp " + formatRp(diskon) + "\n" +
            "TOTAL BAYAR : Rp " + formatRp(totalBayar) + "\n" +
            "\n" +
            "====================================";

        // Menampilkan struk
        let kotakStruk = document.getElementById("hasilStruk");

        kotakStruk.textContent = struk;
        kotakStruk.style.display = "block";
    }

    // Langsung muncul ketika website dibuka
    jalankanKasir();

</script>

</body>
</html>
