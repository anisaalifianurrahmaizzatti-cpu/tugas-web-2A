<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>percabangan if</title>
</head>
<body>
    <script type="text/javascript">
        var password = prompt('Masukan Password Anda');
 
        if (password == 'admin123') {
            document.write('<h3>Selamat Datang Admin</h3>');
        } else {
            document.write('<h3>Maaf Password Salah</h3>');
        }
    </script>
    
</body>
</html>
